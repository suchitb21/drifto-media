<!-- =============================================================
     FOOTER COMPONENT
     Three-column layout: Logo+Socials | Quick Links | Contact
     Background: #000000
     Accent: #ff6105 (orange) | Text: #fff5dc (beige)
     ============================================================= -->
<footer class="footer" role="contentinfo" id="contact">

  <!-- ── TOP BORDER ACCENT LINE ──────────────────────────────── -->
  <div class="footer__top-border" aria-hidden="true"></div>

  <div class="footer__inner">

    <!-- ── COLUMN 1: Logo + Tagline + Social Icons ─────────────── -->
    <div class="footer__col footer__col--brand">

      <!-- Logo links back to home -->
      <a href="/" class="footer__logo-link" aria-label="Go to home page">
        <img
          src="logo-white.webp"
          alt="Brand logo"
          class="footer__logo"
          width="90"
          height="90" />
      </a>

      <!-- Remote-work tagline -->
      <p class="footer__tagline">
        We work <span class="footer__tagline-accent">remotely</span> —<br>
        everywhere &amp; anywhere.
      </p>

      <!-- Social icon row -->
      <div class="footer__socials" aria-label="Social media links">

        <!-- Instagram -->
        <a href="https://www.instagram.com/driftomedia/" class="footer__social-btn" target="_blank" aria-label="Instagram" title="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
          </svg>
        </a>

        <!-- YouTube -->
        <a href="https://www.youtube.com/@DriftoMedia" target="_blank" class="footer__social-btn" aria-label="YouTube" title="YouTube">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/>
            <path d="m10 15 5-3-5-3z"/>
          </svg>
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/919321876981?text=Hello,%20I%20want%20to%20learn%20more" class="footer__social-btn" target="_blank" aria-label="WhatsApp" title="WhatsApp">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
          </svg>
        </a>

      </div>
      <!-- /footer__socials -->

    </div>
    <!-- /col--brand -->


    <!-- ── COLUMN 2: Quick Links ───────────────────────────────── -->
    <div class="footer__col footer__col--links">

      <h3 class="footer__col-heading">Quick Links</h3>

      <!-- Rendered from quickLinks[] in footer.ts -->
      <ul class="footer__link-list" role="list">
        <li *ngFor="let link of quickLinks">
          <a [routerLink]="link.href" class="footer__link">{{ link.label }}</a>
        </li>
      </ul>

    </div>
    <!-- /col--links -->


    <!-- ── COLUMN 3: Contact ───────────────────────────────────── -->
    <div class="footer__col footer__col--contact">

      <h3 class="footer__col-heading">Contact Us</h3>

      <!-- Remote note -->
      <p class="footer__remote-note">
        We're a fully remote team —<br>reach us anytime, online.
      </p>

      <!-- Rendered from contacts[] in footer.ts -->
      <ul class="footer__contact-list" role="list">
        <li
          class="footer__contact-item"
          *ngFor="let contact of contacts">

          <!-- Email icon -->
<span class="footer__contact-icon" aria-hidden="true">
            
            <svg *ngIf="contact.icon === 'email'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>

            <svg *ngIf="contact.icon === 'phone'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" 
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>

          </span>

          <!-- Contact text -->
          <span class="footer__contact-text">
            <!-- subtext label sits above the main email -->
            <span *ngIf="contact.subtext" class="footer__contact-subtext">
              {{ contact.subtext }}
            </span>
            <a
              *ngIf="contact.href"
              [href]="contact.href"
              class="footer__contact-link">
              {{ contact.text }}
            </a>
            <span *ngIf="!contact.href" class="footer_contact_number">{{ contact.text }}</span>
          </span>

        </li>
      </ul>

    </div>
    <!-- /col--contact -->

  </div>
  <!-- /footer__inner -->


  <!-- ── BOTTOM BAR: copyright ──────────────────────────────── -->
  <div class="footer__bottom">
    <p class="footer__copyright">
      &copy; {{ currentYear }} Drifto Media. All rights reserved.
    </p>
  </div>

  <!-- ── BOTTOM BORDER ACCENT LINE ────────────────────────────── -->
  <div class="footer__bottom-border" aria-hidden="true"></div>

</footer>
<!-- /footer -->
