<!-- =============================================================
     NAVBAR COMPONENT
     - Transparent by default, solid (#fff5dc) after 50 vh scroll
     - [class.scrolled] binding drives the state change
     - Mobile hamburger collapses nav links into a drawer
     ============================================================= -->
<header
  class="navbar"
  [class.scrolled]="isScrolled()"
  [class.menu-open]="menuOpen()"
  role="banner">

  <nav class="navbar__inner" aria-label="Main navigation">

    <!-- ── LOGO (links to home) ───────────────────────────── -->
    <a href="/" class="navbar__logo" aria-label="Go to home page" (click)="closeMenu()">
      <img
        src="logo.webp"
        alt="Brand logo"
        class="navbar__logo-img"
        width="48"
        height="48" />
    </a>

    <!-- ── DESKTOP NAV LINKS (centre) ────────────────────── -->
    <ul class="navbar__links" role="list">

      <!-- Services -->
      <li>
        <a routerLink="/" fragment="service" class="navbar__link" (click)="closeMenu()">
          Services
        </a>
      </li>

      <!-- Portfolio -->
      <li>
        <a routerLink="/portfolio" class="navbar__link" (click)="closeMenu()">
          Portfolio
        </a>
      </li>
    
      <!-- Wedding Gallery -->
      <li>
        <a routerLink="/wedding-gallery" class="navbar__link" (click)="closeMenu()">
          Wedding Gallery
        </a>
      </li>

      <!-- About Us -->
      <li>
        <a routerLink="/about-us" class="navbar__link" (click)="closeMenu()">
          About Us
        </a>
      </li>


    </ul>

    <!-- ── RIGHT SIDE: CTA + Hamburger ───────────────────── -->
    <div class="navbar__right">

      <!-- Contact CTA button (always visible on desktop) -->
      <a routerLink="/" fragment="contact" class="navbar__cta" (click)="closeMenu()">
        Contact
      </a>

      <!-- Hamburger button — mobile only ───────────────── -->
      <button
        class="navbar__hamburger"
        [class.is-active]="menuOpen()"
        (click)="toggleMenu()"
        aria-label="Toggle navigation menu"
        [attr.aria-expanded]="menuOpen()">

        <!-- Three bars animate into × when open -->
        <span class="navbar__hamburger-bar"></span>
        <span class="navbar__hamburger-bar"></span>
        <span class="navbar__hamburger-bar"></span>
      </button>

    </div>

  </nav>

  <!-- ── MOBILE DRAWER ─────────────────────────────────────── -->
  <!-- Slides down from header when menuOpen is true          -->
  <div class="navbar__drawer" [class.is-open]="menuOpen()" role="dialog" aria-label="Mobile navigation">

    <ul class="navbar__drawer-links" role="list">

      <li><a routerLink="/"  fragment="service" class="navbar__drawer-link" (click)="closeMenu()">Services</a></li>
      <li><a routerLink="/portfolio"       class="navbar__drawer-link" (click)="closeMenu()">Portfolio</a></li>
      <li><a routerLink="/wedding-gallery" class="navbar__drawer-link" (click)="closeMenu()">Wedding Gallery</a></li>
      <li><a routerLink="/about-us"           class="navbar__drawer-link" (click)="closeMenu()">About Us</a></li>


      <!-- Contact repeated in drawer for mobile convenience -->
      <li>
        <a routerLink="/" fragment="contact" class="navbar__drawer-cta" (click)="closeMenu()">Contact</a>
      </li>

    </ul>

  </div>

</header>
